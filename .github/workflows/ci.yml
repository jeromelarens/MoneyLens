name: MoneyLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verification:
    name: Test, Lint, Typecheck & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting
        run: npm run format:check

      - name: Run static analysis (ESLint)
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run test suites
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/moneylens_ci_test
          PORT: 4001
          LOG_LEVEL: silent
        run: npm run test

      - name: Verify production builds
        run: npm run build
